
server:
  port: ${PORT:${SERVER_PORT:9000}}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:linebook-backend}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      max-lifetime: ${DB_MAX_LIFETIME_MS:300000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:20000}

  jpa:
    open-in-view: ${JPA_OPEN_IN_VIEW:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSED_ENDPOINTS:health,info}

linebook:
  zone: ${LINEBOOK_ZONE:Asia/Kolkata}
  operator-name: ${OPERATOR_NAME:Surya Cable Network}
  default-agent-id: ${DEFAULT_AGENT_ID:ag-01}
  current-cycle-only: ${CURRENT_CYCLE_ONLY:true}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}
    max-age: ${CORS_MAX_AGE:1h}
