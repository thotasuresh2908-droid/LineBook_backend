# LineBook backend + MySQL.
#
#   docker compose up --build                                  # http://localhost:9000
#
# The database starts empty apart from the package catalogue. Set LINEBOOK_ADMIN_EMAIL and
# LINEBOOK_ADMIN_PASSWORD below to get your first sign-in, then add agents and customers in the app.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: linebook_db
      MYSQL_USER: linebook
      MYSQL_PASSWORD: linebook
      TZ: Asia/Kolkata
    ports:
      - "3310:3306"
    volumes:
      - linebook-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  linebook-backend:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/linebook_db
      DB_USERNAME: linebook
      DB_PASSWORD: linebook
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      # Sign-in. Set a real secret outside local use; the first admin is created on first start.
      LINEBOOK_AUTH_SECRET: ${LINEBOOK_AUTH_SECRET:-local-dev-secret-change-me}
      LINEBOOK_ADMIN_EMAIL: ${LINEBOOK_ADMIN_EMAIL:-}
      LINEBOOK_ADMIN_PASSWORD: ${LINEBOOK_ADMIN_PASSWORD:-}
      LINEBOOK_ADMIN_NAME: ${LINEBOOK_ADMIN_NAME:-LineBook Admin}
    ports:
      - "9000:9000"

volumes:
  linebook-mysql:
