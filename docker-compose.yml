# LineBook backend + MySQL.
#
#   docker compose up --build                                  # http://localhost:9000
#   SPRING_PROFILES_ACTIVE=demo docker compose up --build      # also load the 36 demo customers and this month's bills
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: linebook_db
      MYSQL_USER: linebook
      MYSQL_PASSWORD: linebook
      TZ: Asia/Kolkata
    ports:
      - "3310:3306"
    volumes:
      - linebook-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  linebook-backend:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/linebook_db
      DB_USERNAME: linebook
      DB_PASSWORD: linebook
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
    ports:
      - "9000:9000"

volumes:
  linebook-mysql:
